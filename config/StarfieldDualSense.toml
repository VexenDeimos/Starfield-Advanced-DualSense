# Starfield DualSense v0.6.3
#
# =============================================================================
# SYNTAX NOTES
# =============================================================================
# Boolean switches: true or false (no quotes)
#   Example: AdaptiveTriggers = true
#
# Numeric strengths/volumes: decimal numbers (no quotes)
#   Example: SpeakerVolume = 0.8
#
# String choices: use quotes
#   Example: OperatingMode = "Full"

# =============================================================================
# RUNTIME / RECONNECT
# =============================================================================
# Valid values: "Full" or "ReconnectFixOnly"
# "ReconnectFixOnly" runs only the passive DualSense reconnect repair.
OperatingMode = "Full"

# Restore native DualSense recognition after a physical reconnect.
# Forced on while OperatingMode = "ReconnectFixOnly".
DualSenseReconnectFix = true

# =============================================================================
# ADAPTIVE TRIGGERS
# =============================================================================
AdaptiveTriggers = true
# Overall adaptive-trigger strength. Valid range: 0.0-1.0
TriggerStrength = 1.0

# =============================================================================
# HAPTICS
# =============================================================================
# Master gameplay haptic feedback.
# USB uses DualSense advanced audio haptics; Bluetooth uses SAD compatible rumble.
AdvancedHaptics = true
# Overall gameplay-haptic strength. Valid range: 0.0-3.0
# 1.0 preserves SAD's standard tuning exactly.
# 2.0 preserves the first overdrive level; values above 2.0 enter the extreme range up to 3.0.
HapticStrength = 1.0

# Additional Bluetooth-only haptic multiplier.
# Effective Bluetooth feedback = normal SAD haptics * this value.
# USB haptics are unaffected. Valid range: 0.0-1.0
BluetoothHapticStrength = 1.0

# =============================================================================
# WEAPON HAPTICS
# =============================================================================
# Master switch for on-foot weapon vibration only.
# This does not disable damage, boostpack, ship, vehicle, Digipick,
# adaptive-trigger effects, or controller-speaker audio.
WeaponHaptics = true

# Ballistic Handguns
WeaponHapticsBallisticHandguns = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsBallisticHandgunsStrength = 1.0

# Rapid Ballistics
WeaponHapticsRapidBallistics = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsRapidBallisticsStrength = 1.0

# Ballistic Rifles
WeaponHapticsBallisticRifles = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsBallisticRiflesStrength = 1.0

# Precision Ballistics
WeaponHapticsPrecisionBallistics = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsPrecisionBallisticsStrength = 1.0

# Shotguns
WeaponHapticsShotguns = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsShotgunsStrength = 1.0

# Heavy Ballistics
WeaponHapticsHeavyBallistics = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsHeavyBallisticsStrength = 1.0

# Launchers
WeaponHapticsLaunchers = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsLaunchersStrength = 1.0

# Magnetic Weapons
WeaponHapticsMagnetic = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsMagneticStrength = 1.0

# Laser Weapons
WeaponHapticsLaser = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsLaserStrength = 1.0

# Particle Weapons
WeaponHapticsParticle = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsParticleStrength = 1.0

# Sustained Energy
WeaponHapticsSustainedEnergy = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsSustainedEnergyStrength = 1.0

# EM Weapons
WeaponHapticsEM = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsEMStrength = 1.0

# Melee Weapons
WeaponHapticsMelee = true
# Group multiplier on top of HapticStrength. Valid range: 0.0-3.0
WeaponHapticsMeleeStrength = 1.0

# Boostpack-only haptics. The boostpack strength is multiplied by the global
# HapticStrength setting above. Valid boostpack range: 0.0-3.0
BoostpackHaptics = true
BoostpackHapticsStrength = 1.0

# Music-only haptics. Gameplay haptics retain priority.
# Valid music strength range: 0.0-2.0
MusicHapticsEnabled = false
MusicHapticsStrength = 0.1

# =============================================================================
# CONTROLLER SPEAKER
# Supported over both USB and Bluetooth.
# =============================================================================
ControllerSpeaker = true
# Master controller-speaker volume. Valid range: 0.0-1.0
SpeakerVolume = 0.8

# REMOTE/RADIO VOICE ONLY. This does not affect weapon sounds.
# Valid values: "Both" or "ControllerOnly"
# "Both" = qualifying remote/radio VO through normal Starfield audio and the
#          controller speaker.
# "ControllerOnly" = qualifying remote/radio VO is removed from normal output
#                    only after controller playback is accepted.
SpeakerOutputMode = "ControllerOnly"

# Remote/radio communications through the controller speaker.
# Set false to keep radio/comms voice completely off the controller.
SpeakerComms = true

# Language used for remote/radio controller-speaker voice.
# Valid values: "English", "Auto", "French", "German", "Spanish", "Japanese"
# Auto is the default and follows Starfield's supported voice language.
# Auto follows Starfield's current supported voice language.
SpeakerVoiceLanguage = "Auto"

# Scanner/interface sounds routed to the controller speaker.
SpeakerScannerUI = true

# Weapon sounds remain additive to Starfield's normal weapon mix.
SpeakerWeapons = true
# Weapon-only controller-speaker volume. Valid range: 0.0-1.0
SpeakerWeaponsVolume = 1.0

# Digipick sounds, including engagement/equip, minigame cues, and Undo.
SpeakerDigipick = true

# Supported crafting/research station sounds.
SpeakerCrafting = true

# Real boostpack audio mirrored to the controller speaker.
SpeakerBoostpack = true
# Boostpack-only controller-speaker volume. Valid range: 0.0-1.0
SpeakerBoostpackVolume = 1.0

# =============================================================================
# CONTROLLER FEATURES
# =============================================================================
Lightbar = true
Touchpad = true

# =============================================================================
# DIAGNOSTICS
# =============================================================================
DebugLogging = false

# =============================================================================
# POWER
# =============================================================================
# Turn off the DualSense when Starfield exits if the controller is using Bluetooth.
# Has no effect on USB connections.
BluetoothPowerOffOnExit = true
BluetoothIdleTimeoutEnabled = true
BluetoothIdleTimeoutMinutes = 15
